<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="usage-token" content="__TOKEN__" />
    <title>用量与订阅</title>
    <link rel="icon" href="icon.svg" />
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" type="module"></script>
  </head>
  <body>
    <div class="shell">
      <aside>
        <a class="brand" href="./"
          ><img src="icon.svg" alt="" /><span
            >用量与订阅<small>MAGPIE</small></span
          ></a
        >
        <nav aria-label="主导航">
          <button data-page="usage" class="active">用量</button
          ><button data-page="subscriptions">订阅</button
          ><button data-page="channels">通知渠道</button
          ><button data-page="deliveries">发送记录</button
          ><button data-page="settings">设置</button>
        </nav>
        <a href="original/?lang=zh" target="_blank" class="original"
          >打开原版用量树 ↗</a
        >
        <div class="runtime" id="runtime">正在连接后台…</div>
      </aside>
      <main>
        <header>
          <div>
            <p class="eyebrow">MAGPIE / USAGE SUBSCRIPTIONS</p>
            <h1 id="page-title">用量</h1>
            <p id="page-description" class="muted">
              按账号与模型查看消耗，以及账号当前额度。
            </p>
          </div>
          <button id="refresh" class="secondary">刷新</button>
        </header>
        <div id="notice" class="notice" hidden role="status"></div>
        <div id="content" aria-live="polite">
          <div class="empty">正在读取配置…</div>
        </div>
      </main>
    </div>
    <dialog id="editor"><div id="editor-content"></div></dialog>
    <dialog id="preview">
      <div class="dialog-head">
        <h2>报表预览</h2>
        <button data-close="preview" class="secondary">关闭</button>
      </div>
      <div id="preview-content"></div>
    </dialog>
    <dialog id="confirm">
      <h2 id="confirm-title">确认操作</h2>
      <p id="confirm-message"></p>
      <div class="actions">
        <button id="confirm-no" class="secondary">取消</button
        ><button id="confirm-yes">确认</button>
      </div>
    </dialog>
    <div id="toast" role="status" hidden></div>
  </body>
</html>
