<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="usage-token" content="__TOKEN__" />
    <title>用量与订阅 · Magpie</title>
    <link rel="icon" href="icon.svg" />
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" type="module"></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="./" aria-label="Magpie 用量与订阅首页">
          <span class="brand-mark"><img src="icon.svg" alt="" /></span>
          <span class="brand-copy"
            ><strong>Magpie</strong><small>用量与订阅</small></span
          >
        </a>
        <div class="nav-label">工作区</div>
        <nav class="navigation" aria-label="主导航">
          <button data-page="usage" class="active" aria-current="page">
            <span data-icon="chart"></span><span>用量</span>
          </button>
          <button data-page="subscriptions">
            <span data-icon="calendar"></span><span>订阅</span>
          </button>
          <button data-page="channels">
            <span data-icon="send"></span><span>通知渠道</span>
          </button>
          <button data-page="deliveries">
            <span data-icon="history"></span><span>发送记录</span>
          </button>
        </nav>
        <div class="sidebar-bottom">
          <nav aria-label="辅助导航">
            <button data-page="settings">
              <span data-icon="settings"></span><span>设置</span>
            </button>
          </nav>
          <div class="runtime" id="runtime">
            <i></i><span>正在连接后台…</span>
          </div>
        </div>
      </aside>
      <div class="workspace">
        <header class="topbar">
          <div class="breadcrumb">
            <span>Magpie</span><b>/</b><strong>用量与订阅</strong>
          </div>
          <button
            id="refresh"
            class="icon-button"
            title="刷新当前页面"
            aria-label="刷新当前页面"
          >
            <span data-icon="refresh"></span><span>刷新</span>
          </button>
        </header>
        <main class="main-view">
          <div class="page-heading">
            <div>
              <h1 id="page-title">用量</h1>
              <p id="page-description">
                按账号与模型查看消耗，以及账号当前额度。
              </p>
            </div>
          </div>
          <div id="notice" class="notice" hidden role="status"></div>
          <div id="connection-expired" class="notice" hidden role="alert">
            后台已重启。未保存内容仍保留在本页，请处理后重新连接。
            <button id="reconnect" type="button" class="secondary">
              重新连接
            </button>
          </div>
          <div id="content" aria-live="polite">
            <div class="empty"><span class="spinner"></span>正在读取配置…</div>
          </div>
        </main>
      </div>
    </div>
    <dialog id="editor" class="dialog roomy">
      <div id="editor-content"></div>
    </dialog>
    <dialog id="preview" class="dialog roomy">
      <div class="dialog-head">
        <div>
          <span class="dialog-kicker">REPORT</span>
          <h2 id="preview-title">报表预览</h2>
        </div>
        <button data-close="preview" class="icon-only" aria-label="关闭预览">
          <span data-icon="close"></span>
        </button>
      </div>
      <div id="preview-content" class="dialog-body"></div>
      <div class="dialog-footer">
        <button data-close="preview" class="button secondary">关闭</button>
      </div>
    </dialog>
    <dialog id="confirm" class="dialog confirm-dialog">
      <div class="dialog-body">
        <h2 id="confirm-title">确认操作</h2>
        <p id="confirm-message"></p>
      </div>
      <div class="dialog-footer">
        <button id="confirm-no" class="button secondary">取消</button
        ><button id="confirm-yes" class="button primary">确认</button>
      </div>
    </dialog>
    <div id="toast" role="status" hidden></div>
  </body>
</html>
